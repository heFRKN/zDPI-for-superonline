<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zDPI (Yönetici Olarak Çalıştır)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-badge">
        <span class="admin-badge">⚡ Yönetici Modu</span>
      </div>
      <div class="lang-switch">
        <button id="btn-tr" class="lang-btn active" onclick="setLanguage('tr')">TR</button>
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
      </div>
    </header>

    <!-- Hero Card -->
    <section class="glass-card hero-card">
      <div class="logo-wrapper">
        <img src="assets/logo.png" alt="Logo" class="brand-logo" id="app-logo">
      </div>
      <div class="brand-info">
        <h1 class="brand-title">zDPI</h1>
        <p class="brand-subtitle" data-i18n="subtitle">DPI Bypass & Ağ Optimizasyonu</p>
        <span class="engineer-tag">by FRKN</span>
      </div>
    </section>

    <!-- Live Status -->
    <section class="glass-card status-card">
      <div class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <div class="status-texts">
          <span class="status-label" data-i18n="status_title">Durum</span>
          <span class="status-val" id="status-val" data-i18n="status_checking">Kontrol Ediliyor...</span>
        </div>
      </div>
      <div class="ping-pill">
        <span class="ping-icon">⚡</span>
        <span class="ping-val">0ms Ping</span>
      </div>
    </section>

    <!-- Actions -->
    <section class="actions-grid">
      <!-- 1. Install Service -->
      <button class="glass-btn btn-primary" id="btn-install" onclick="installService()">
        <div class="btn-icon">🚀</div>
        <div class="btn-content">
          <span class="btn-title" data-i18n="btn_install_title">Hizmeti Kur (Otomatik Başlat)</span>
          <span class="btn-desc" data-i18n="btn_install_desc">Windows açılışında arkada sessizce çalışır</span>
        </div>
      </button>

      <!-- 2. One-Time Mode -->
      <button class="glass-btn btn-secondary" id="btn-onetime" onclick="toggleOneTime()">
        <div class="btn-icon" id="onetime-icon">🌐</div>
        <div class="btn-content">
          <span class="btn-title" id="onetime-title" data-i18n="btn_onetime_title">Tek Seferlik Mod</span>
          <span class="btn-desc" id="onetime-desc" data-i18n="btn_onetime_desc">Geçici olarak başlatır, kapatınca temizlenir</span>
        </div>
      </button>

      <!-- 3. Connection Test -->
      <button class="glass-btn btn-secondary" id="btn-test" onclick="runConnectionTest()">
        <div class="btn-icon">🔍</div>
        <div class="btn-content">
          <span class="btn-title" data-i18n="btn_test_title">Bağlantıyı Test Et</span>
          <span class="btn-desc" data-i18n="btn_test_desc">Discord ve sunucu erişimlerini hızlıca sına</span>
        </div>
      </button>

      <!-- 4. Clean / Reset -->
      <button class="glass-btn btn-danger" id="btn-uninstall" onclick="uninstallAll()">
        <div class="btn-icon">🗑️</div>
        <div class="btn-content">
          <span class="btn-title" data-i18n="btn_clean_title">Tüm Sistemleri Temizle</span>
          <span class="btn-desc" data-i18n="btn_clean_desc">Servisleri kaldır ve varsayılana sıfırla</span>
        </div>
      </button>
    </section>

    <!-- Activity Log Terminal -->
    <section class="glass-card log-card">
      <div class="log-header">
        <span class="log-title" data-i18n="log_title">Günlük</span>
        <span class="log-clear" onclick="clearLogs()" data-i18n="log_clear">Temizle</span>
      </div>
      <div class="log-body" id="log-body">
        <div class="log-line info">[Sistem] zDPI hazır.</div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <span>zDPI • by FRKN</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
